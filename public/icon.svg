<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Background with circle (no square frame) -->
  <circle cx="256" cy="256" r="256" fill="#090d16" />
  <circle cx="256" cy="256" r="232" fill="url(#bgGrad)" opacity="0.9" />
  
  <!-- Outer Speech Balloon (Manga Style) -->
  <g filter="url(#shadow)">
    <!-- Back Bubble (Japanese/Source) -->
    <path d="M 140 120 C 230 110, 370 120, 390 190 C 400 240, 360 290, 290 300 L 320 360 L 250 310 C 190 315, 120 290, 110 220 C 100 160, 120 125, 140 120 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="6" />
    <text x="210" y="225" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="#38bdf8" text-anchor="middle">文</text>
    
    <!-- Front Bubble (Translation / Target) -->
    <path d="M 230 200 C 320 190, 420 210, 410 290 C 400 350, 330 380, 270 380 L 250 430 L 210 380 C 160 375, 140 330, 150 270 C 160 215, 200 200, 230 200 Z" fill="url(#bubbleGrad)" stroke="#6366f1" stroke-width="6" />
    <text x="290" y="305" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="58" fill="#1e1b4b" text-anchor="middle">A</text>
  </g>
  
  <!-- Lightning / Fast Accent -->
  <path d="M 370 140 L 400 120 L 385 155 L 420 150 L 360 200 L 375 165 Z" fill="#fbbf24" filter="url(#shadow)" />
</svg>
